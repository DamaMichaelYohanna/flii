<!-- Shared Public Navigation Header -->
<header class="bg-white/95 backdrop-blur border-b border-slate-100 sticky top-0 z-40">
    <div class="max-w-7xl h-[72px] sm:h-[76px] mx-auto px-4 sm:px-6 flex items-center justify-between">

        <!-- Logo -->
        <div class="flex items-center">
            {% include "components/logo.html" %}
        </div>

        <!-- Desktop Navigation Links (Visible on Large Screens) -->
        <nav class="hidden lg:flex items-center gap-7 text-[12px] font-bold text-slate-600">
            <a href="/#how-it-works" class="hover:text-teal-700 transition-colors">How it works</a>
            <a href="{% url 'opportunities:list' %}"
                class="{% if request.resolver_match.app_name == 'opportunities' %}text-[#0b3558] font-extrabold{% else %}text-slate-600 hover:text-[#0b3558]{% endif %} flex items-center gap-1.5 transition-colors">
                <i data-lucide="compass" class="w-3.5 h-3.5 text-[#ef7d37]"></i>
                <span>Scholarships</span>
            </a>
            <a href="{% url 'blog:list' %}"
                class="{% if request.resolver_match.app_name == 'blog' %}text-[#1261a0] font-extrabold{% else %}text-slate-600 hover:text-[#0b3558]{% endif %} flex items-center gap-1.5 transition-colors">
                <i data-lucide="newspaper" class="w-3.5 h-3.5"></i>
                <span>Insights & News</span>
            </a>
            <a href="/#why" class="hover:text-teal-700 transition-colors">Why Flii</a>
            <a href="/#faq" class="hover:text-teal-700 transition-colors">FAQs</a>
            <a href="https://chat.whatsapp.com/Gcsj2uxeTlYAZmxcUg8Cch" target="_blank" rel="noopener noreferrer" class="text-[#075E54] hover:text-[#25D366] font-extrabold flex items-center gap-1.5 transition-colors">
                <svg class="w-3.5 h-3.5 fill-[#25D366]" viewBox="0 0 24 24">
                    <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.885-9.884 9.885m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.82 11.82 0 00-3.48-8.413z"/>
                </svg>
                <span>WhatsApp Group</span>
            </a>

        </nav>

        <!-- Right Action Buttons & Mobile Hamburger -->
        <div class="flex items-center gap-2 sm:gap-3 text-xs sm:text-sm font-bold">
            {% if user.is_authenticated %}
            {% if user.is_staff %}
            <a href="{% url 'dashboard:admin_system_dashboard' %}"
                class="hidden sm:inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-bold bg-emerald-50 text-emerald-800 border border-emerald-200 hover:bg-emerald-100 transition-colors">
                <i data-lucide="shield-check" class="w-3.5 h-3.5 text-emerald-600"></i>
                <span>Admin Hub</span>
            </a>
            {% endif %}
            <a href="{% url 'dashboard:index' %}"
                class="inline-flex items-center gap-1.5 sm:gap-2 rounded-full bg-[#0b3558] px-3.5 sm:px-5 py-2 sm:py-2.5 text-white hover:bg-[#1261a0] text-xs sm:text-sm shadow-sm transition-all">
                <span>Dashboard</span>
                <i data-lucide="arrow-right" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i>
            </a>
            {% else %}
            <a href="{% url 'accounts:login' %}"
                class="hidden sm:inline text-slate-700 hover:text-[#0b3558] transition-colors">Sign in</a>
            <a href="{% url 'accounts:register' %}"
                class="inline-flex items-center gap-1.5 sm:gap-2 rounded-full bg-[#0b3558] px-3.5 sm:px-5 py-2 sm:py-2.5 text-white hover:bg-[#1261a0] text-xs sm:text-sm shadow-sm transition-all">
                <span>Start for free</span>
                <i data-lucide="arrow-up-right" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i>
            </a>
            {% endif %}

            <!-- Mobile Hamburger Menu Button (Visible on Screens < lg) -->
            <button type="button"
                class="mobile-menu-trigger lg:hidden p-2 rounded-xl text-slate-700 hover:text-slate-900 hover:bg-slate-100 transition-colors focus:outline-none flex items-center justify-center border border-slate-200/80 shadow-sm"
                aria-label="Open Navigation Menu">
                <i data-lucide="menu" class="w-5 h-5"></i>
            </button>
        </div>

    </div>
</header>
